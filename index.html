<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN Board MCQ Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-500">

    <!-- Homepage Section -->
    <section id="home-page" class="container mx-auto p-4">
        <header class="text-center py-8">
            <h1 class="text-4xl font-bold">TN Board MCQ Practice</h1>
            <p class="text-xl text-gray-600 dark:text-gray-400">Select your standard, subject, and lesson to start.</p>
        </header>

        <div class="max-w-lg mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
            <div class="mb-4">
                <label for="standard-select" class="block text-sm font-medium mb-2">Standard:</label>
                <select id="standard-select" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700">
                    <option value="">-- Select Standard --</option>
                    <option value="+1">+1</option>
                    <option value="+2">+2</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="subject-select" class="block text-sm font-medium mb-2">Subject:</label>
                <select id="subject-select" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700" disabled>
                    <option value="">-- Select Subject --</option>
                    {/* Options will be populated by JS */}
                </select>
            </div>

            <div class="mb-4">
                <label for="lesson-select" class="block text-sm font-medium mb-2">Lesson:</label>
                <select id="lesson-select" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700" disabled>
                    <option value="">-- Select Lesson --</option>
                    {/* Options will be populated by JS */}
                </select>
            </div>

            <div class="mb-6">
                <input type="checkbox" id="mixed-questions-checkbox" class="mr-2">
                <label for="mixed-questions-checkbox" class="text-sm font-medium">Mixed Questions (from all lessons in subject)</label>
            </div>

            <button id="start-quiz-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md transition duration-300" disabled>
                Start Quiz
            </button>
        </div>
         <div class="absolute top-4 right-4">
            <button id="dark-mode-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                <svg id="sun-icon" class="w-6 h-6 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M12 5a7 7 0 100 14 7 7 0 000-14z"></path></svg>
                <svg id="moon-icon" class="w-6 h-6 text-gray-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>
    </section>

    <!-- Quiz Section -->
    <section id="quiz-page" class="container mx-auto p-4 hidden">
        <div class="max-w-3xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
            <div class="flex justify-between items-center mb-6">
                <div id="progress-indicator" class="text-sm font-medium text-gray-700 dark:text-gray-300">Question 1 of X</div>
                <div id="timer" class="text-xl font-bold text-red-500">00:00</div>
            </div>

            <div id="quiz-content">
                {/* Questions will be loaded here by JS */}
            </div>

            <button id="submit-quiz-btn" class="mt-8 w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-md transition duration-300">
                Submit Test
            </button>
        </div>
    </section>

    <!-- Result Section -->
    <section id="result-page" class="container mx-auto p-4 hidden">
        <div class="max-w-lg mx-auto bg-white dark:bg-gray-800 p-8 rounded-lg shadow-xl text-center">
            <h2 class="text-3xl font-bold mb-4">Quiz Results</h2>
            <div id="score-summary" class="mb-6">
                <p class="text-xl">Your Score: <span id="score" class="font-bold">0 / 0</span> (<span id="percentage" class="font-bold">0%</span>)</p>
                <p id="result-message" class="text-lg mt-2 italic">Keep practicing!</p>
            </div>

            <div id="confetti-container" class="absolute inset-0 pointer-events-none"></div>


            <div id="detailed-review" class="mt-6 text-left">
                <h3 class="text-xl font-semibold mb-3">Incorrect Answers:</h3>
                <div id="incorrect-answers-list">
                    {/* Incorrect answers will be listed here by JS */}
                </div>
            </div>

            <div class="mt-8 flex justify-around">
                <button id="retake-quiz-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-md transition duration-300">
                    Retake Test
                </button>
                <button id="return-home-btn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-md transition duration-300">
                    Return to Home
                </button>
            </div>
        </div>
    </section>

    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</body>
</html>
